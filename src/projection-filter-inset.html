<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; style-src 'nonce-__SIFT_NONCE__'; script-src 'nonce-__SIFT_NONCE__';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style nonce="__SIFT_NONCE__">
    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--vscode-editor-background);
      color: var(--vscode-foreground);
      font: 13px var(--vscode-font-family);
    }

    .filter-row {
      box-sizing: border-box;
      display: flex;
      align-items: center;
      height: calc(100% - 5px);
    }

    label {
      flex: none;
      color: var(--vscode-editorLineNumber-foreground);
      user-select: none;
    }

    .input-shell {
      box-sizing: border-box;
      width: min(720px, 100%);
      height: 26px;
      display: flex;
      align-items: center;
      border-radius: 4px;
      border: 1px solid var(--vscode-input-border, transparent);
      background: var(--vscode-input-background);
    }

    .input-shell:focus-within {
      border-color: var(--vscode-focusBorder);
    }

    input {
      box-sizing: border-box;
      min-width: 0;
      height: 24px;
      flex: 1;
      padding: 3px 8px;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--vscode-input-foreground);
      font: inherit;
    }

    input::placeholder {
      color: var(--vscode-input-placeholderForeground);
    }

    .options {
      height: 100%;
      display: flex;
      align-items: center;
      gap: 1px;
      padding-right: 2px;
    }

    button {
      box-sizing: border-box;
      width: 23px;
      height: 21px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 2px;
      outline: none;
      background: transparent;
      color: var(--vscode-input-foreground);
      cursor: pointer;
    }

    button:hover {
      background: var(--vscode-toolbar-hoverBackground);
    }

    button:focus-visible {
      border-color: var(--vscode-focusBorder);
    }

    button.active {
      border-color: var(--vscode-inputOption-activeBorder, var(--vscode-focusBorder));
      background: var(--vscode-inputOption-activeBackground);
      color: var(--vscode-inputOption-activeForeground);
    }

    .codicon,
    .codicon svg {
      display: block;
      width: 16px;
      height: 16px;
    }
  </style>
</head>

<body>
  <div class="filter-row">
    <div class="input-shell">
      <input id="query" type="text" placeholder="__SIFT_PLACEHOLDER__" aria-label="__SIFT_PLACEHOLDER__"
        autocomplete="off" autocapitalize="off" spellcheck="false">

      <div class="options" aria-label="Search options">
        <button type="button" data-option="matchCase" title="Match Case" aria-label="Match Case" aria-pressed="false">
          <span class="codicon codicon-case-sensitive" aria-hidden="true">__SIFT_CASE_SENSITIVE_ICON__</span>
        </button>
        <button type="button" data-option="wholeWord" title="Match Whole Word" aria-label="Match Whole Word"
          aria-pressed="false">
          <span class="codicon codicon-whole-word" aria-hidden="true">__SIFT_WHOLE_WORD_ICON__</span>
        </button>
        <button type="button" data-option="useRegex" title="Use Regular Expression" aria-label="Use Regular Expression"
          aria-pressed="false">
          <span class="codicon codicon-regex" aria-hidden="true">__SIFT_REGEX_ICON__</span>
        </button>
        __SIFT_PROJECT_SEARCH_BUTTON__
      </div>
    </div>
  </div>
  <script nonce="__SIFT_NONCE__">
    const vscode = acquireVsCodeApi()
    const initialState = __SIFT_INITIAL_STATE__
    const input = document.getElementById('query')
    const optionButtons = [...document.querySelectorAll('[data-option]')]
    const projectSearchButton = document.querySelector('[data-action="search-project"]')
    const options = { matchCase: initialState.matchCase, wholeWord: initialState.wholeWord, useRegex: initialState.useRegex }
    input.value = initialState.query
    const renderOptions = () => {
      for (const button of optionButtons) {
        const active = options[button.dataset.option]
        button.classList.toggle('active', active)
        button.setAttribute('aria-pressed', String(active))
      }
    }
    const emitOptions = () => vscode.postMessage({ type: 'options', ...options })
    const toggleOption = option => {
      options[option] = !options[option]
      renderOptions()
      emitOptions()
    }
    for (const button of optionButtons) {
      button.addEventListener('click', () => {
        toggleOption(button.dataset.option)
        input.focus()
      })
    }
    projectSearchButton?.addEventListener('click', () => {
      vscode.postMessage({ type: 'searchProject', value: input.value, ...options })
    })
    renderOptions()
    input.addEventListener('input', () => vscode.postMessage({ type: 'query', value: input.value }))
    input.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        event.preventDefault()
        vscode.postMessage({ type: 'closeEditor' })
      } else if (event.key === 'ArrowDown') {
        event.preventDefault()
        vscode.postMessage({ type: 'focusEditor' })
      } else if (event.altKey && event.metaKey) {
        const optionByCode = {
          KeyC: 'matchCase',
          KeyW: 'wholeWord',
          KeyR: 'useRegex',
        }
        const option = optionByCode[event.code]
        if (option) {
          event.preventDefault()
          toggleOption(option)
        }
      }
    })
    window.addEventListener('message', event => {
      const message = event.data
      if (message.type === 'setState') {
        if (input.value !== message.value) {
          input.value = message.value
          input.setSelectionRange(input.value.length, input.value.length)
        }
        options.matchCase = message.matchCase
        options.wholeWord = message.wholeWord
        options.useRegex = message.useRegex
        renderOptions()
      } else if (message.type === 'focus') {
        input.focus()
        input.setSelectionRange(input.value.length, input.value.length)
      }
    })
    vscode.postMessage({ type: 'ready' })
    if (initialState.focusInput) input.focus()
  </script>
</body>

</html>
